<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos</title>
<meta name="theme-color" content="#0f5c6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Gastos</h1><p id="off">A preparar o modo offline…</p></header>
<div id="aviso" role="status" hidden></div>
<main>
  <h2>Definições e dados</h2>

  <section aria-labelledby="t1">
    <h3 id="t1">Valores iniciais</h3>
    <form id="fIniciais" novalidate>
      <label for="iSav">Saldo inicial da poupança (€)</label>
      <input id="iSav" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-describedby="eSav">
      <p class="erro" id="eSav" role="alert"></p>
      <label for="iInv">Valor já investido (€)</label>
      <input id="iInv" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-describedby="eInv">
      <p class="erro" id="eInv" role="alert"></p>
      <label for="iDate">Data de início</label>
      <input id="iDate" type="date" aria-describedby="eDate">
      <p class="erro" id="eDate" role="alert"></p>
      <button class="primario" type="submit">Guardar valores iniciais</button>
    </form>
  </section>

  <section aria-labelledby="t2">
    <h3 id="t2">Backup</h3>
    <p id="ultimo"></p>
    <button id="bExp" type="button" class="primario">Exportar backup (JSON)</button>
    <button id="bImp" type="button">Importar backup</button>
    <input id="fImp" type="file" accept="application/json,.json" hidden>
    <form id="fDias" novalidate>
      <label for="iDias">Lembrar-me do backup ao fim de (dias)</label>
      <input id="iDias" inputmode="numeric" autocomplete="off" aria-describedby="eDias">
      <p class="erro" id="eDias" role="alert"></p>
      <button type="submit">Guardar lembrete</button>
    </form>
  </section>

  <section aria-labelledby="t3">
    <h3 id="t3">Armazenamento</h3>
    <p id="stor">A verificar…</p>
  </section>

  <section aria-labelledby="t4">
    <h3 id="t4">Apagar tudo</h3>
    <p>Remove todos os dados guardados neste dispositivo. Exporta um backup antes.</p>
    <button id="bDel" type="button" class="perigo">Apagar todos os dados</button>
  </section>
  <p id="msg" role="status" aria-live="polite"></p>
</main>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="linha">
      <button value="cancel">Cancelar</button>
      <button value="ok" id="dlgOk" class="primario"></button>
    </div>
  </form>
</dialog>

<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
